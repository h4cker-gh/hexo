<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0c12" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2300c3ff'/%3E%3Cstop offset='0.55' stop-color='%232d5bff'/%3E%3Cstop offset='1' stop-color='%239b00ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Ctext x='16' y='23' font-family='system-ui,sans-serif' font-size='19' font-weight='700' text-anchor='middle' fill='%23041018'%3EH%3C/text%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="HexoBot WhatsApp dashboard — connection state, message activity, live logs, and sending."
    />
    <title>HexoBot · WhatsApp Dashboard</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('hexobot.theme');
          if (stored === 'dark' || stored === 'light' || stored === 'h4cker') {
            document.documentElement.dataset.theme = stored;
          }
        } catch (error) {
          /* localStorage may be unavailable; keep the default theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
